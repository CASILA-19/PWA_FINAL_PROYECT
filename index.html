<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascotas</title>
    <link rel="icon" href="img/icon-192.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0062FF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Mascotas">
    <link rel="apple-touch-icon" href="img/icon-192.svg">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- ── Navbar ─────────────────────────────────────── -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="img/logo.jpg" alt="Logo Mascotas">
                Mascotas PROPWA_001
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <span id="syncStatus" class="badge bg-secondary">Comprobando...</span>
                <button id="btnSync" class="btn btn-sm btn-outline-primary" onclick="syncManager.sync()">
                    <i class="fas fa-rotate me-1"></i>Sincronizar
                </button>
                <div class="vr"></div>
                <span id="notificationStatus" class="badge bg-secondary">Desactivadas</span>
                <button id="btnActivarNotificaciones" class="btn btn-sm btn-success" title="Activar notificaciones push">
                    <i class="fas fa-bell me-1"></i>Activar
                </button>
                <button id="btnDesactivarNotificaciones" class="btn btn-sm btn-danger" style="display:none;" title="Desactivar notificaciones push">
                    <i class="fas fa-bell-slash me-1"></i>Desactivar
                </button>
            </div>
        </div>
    </nav>

    <!-- ── Contenido principal ────────────────────────── -->
    <div class="container mt-4">

        <!-- Formulario -->
        <div class="section-card">
            <p class="section-title">
                <i class="fas fa-paw"></i> Registrar mascota
            </p>
            <form id="mascotaForm">
                <div class="row g-3">
                    <div class="col-12 col-md-4">
                        <input type="text" id="nombre" placeholder="Nombre de la mascota"
                            class="form-control" required>
                    </div>
                    <div class="col-12 col-md-4">
                        <select id="tipo" class="form-select" aria-label="Tipo de mascota" required>
                            <option value="" selected disabled>Tipo de mascota</option>
                            <option value="Perro">🐶 Perro</option>
                            <option value="Gato">🐱 Gato</option>
                            <option value="Pajaro">🐦 Pájaro</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-4">
                        <input type="number" id="edad" placeholder="Edad (años)"
                            class="form-control" min="0" required>
                    </div>
                </div>
                <div class="mt-3 d-flex gap-2">
                    <button id="btnGuardar" type="submit" class="btn btn-primary">
                        <i class="fas fa-plus me-1"></i>Agregar
                    </button>
                    <button id="btnCancelarEdicion" type="button" class="btn btn-secondary d-none">
                        <i class="fas fa-xmark me-1"></i>Cancelar
                    </button>
                </div>
            </form>
        </div>

        <!-- Tabla de mascotas -->
        <div class="section-card">
            <p class="section-title">
                <i class="fas fa-list"></i> Lista de mascotas
            </p>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col">Nombre</th>
                            <th scope="col">Tipo</th>
                            <th scope="col">Edad</th>
                            <th scope="col" class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="mascotasTbody">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Geolocalización -->
        <div class="section-card">
            <p class="section-title">
                <i class="fas fa-map-location-dot"></i> Ubicación
            </p>
            <button id="geoBtn" class="geo-btn mb-3" onclick="getGeoLocation()">
                <i class="fas fa-location-crosshairs"></i> Obtener mi ubicación
            </button>
            <div id="map"></div>
        </div>

        <!-- Cámara -->
        <div class="section-card">
            <p class="section-title">
                <i class="fas fa-camera"></i> Cámara
            </p>
            <div class="d-flex flex-column align-items-start gap-3">
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <select id="cameraSelect" class="form-select" style="width: auto;">
                        <option value="user">Cámara frontal</option>
                        <option value="environment">Cámara trasera</option>
                    </select>
                    <button id="btnCamara" class="btn btn-secondary">
                        <i class="fas fa-video me-1"></i>Abrir cámara
                    </button>
                    <button id="btnFoto" class="btn btn-primary" style="display:none;">
                        <i class="fas fa-circle me-1"></i>Tomar foto
                    </button>
                </div>
                <video id="video" width="320" height="240" autoplay style="display:none;"></video>
                <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
                <img id="foto" alt="Foto tomada" style="display:none; max-width:320px; margin-top:0.5rem;" />
            </div>
        </div>

    </div><!-- /container -->

    <!-- Toast container -->
    <div id="toastContainer"></div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pouchdb@9.0.0/dist/pouchdb.min.js"></script>
    <script src="js/geo.js"></script>
    <script src="js/app.js"></script>
    <script src="js/photo.js"></script>

    <!-- Registro del Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        console.log('[SW] Registrado:', reg.scope);
                        window.swReg = reg;
                        
                        // Verificar suscripción existente
                        reg.pushManager.getSubscription().then(subscription => {
                            if (subscription) {
                                console.log('Suscripción existente encontrada:', subscription);
                                if (window.verificarSuscripcion) {
                                    window.verificarSuscripcion(true);
                                }
                            }
                        });
                    })
                    .catch(err => console.error('[SW] Error al registrar:', err));
            });
        }
    </script>

</body>
</html>
