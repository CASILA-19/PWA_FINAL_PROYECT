<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascotas</title>
    <link rel="icon" href="img/icon-192.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0062FF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Mascotas">
    <link rel="apple-touch-icon" href="img/icon-192.svg">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- ── Navbar ─────────────────────────────────────── -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <button class="btn btn-outline-primary me-2" id="btnMenuToggle" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <a class="navbar-brand" href="#">
                <img src="img/logo.jpg" alt="Logo Mascotas">
                Mascotas PROPWA_001
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <span id="usuarioActual" class="badge bg-primary"></span>
                <div class="vr"></div>
                <span id="syncStatus" class="badge bg-secondary">Comprobando...</span>
                <button id="btnSync" class="btn btn-sm btn-outline-primary" onclick="syncManager.sync()">
                    <i class="fas fa-rotate me-1"></i>Sincronizar
                </button>
                <div class="vr"></div>
                <span id="notificationStatus" class="badge bg-secondary">Desactivadas</span>
                <button id="btnActivarNotificaciones" class="btn btn-sm btn-success"
                    title="Activar notificaciones push">
                    <i class="fas fa-bell me-1"></i>Activar
                </button>
                <button id="btnDesactivarNotificaciones" class="btn btn-sm btn-danger" style="display:none;"
                    title="Desactivar notificaciones push">
                    <i class="fas fa-bell-slash me-1"></i>Desactivar
                </button>
            </div>
        </div>
    </nav>

    <!-- ── Menú Lateral Desplegable ─────────────────────────────────────── -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h5>Menú</h5>
            <button class="btn-close" onclick="toggleSidebar()"></button>
        </div>
        <nav class="sidebar-nav">
            <a href="#registroCenso" class="sidebar-link" onclick="scrollToSection('registroCenso'); toggleSidebar()">
                <i class="fas fa-clipboard-list"></i> Registrar Censo
            </a>
            <a href="mapa.html" class="sidebar-link">
                <i class="fas fa-map"></i> Ver Mapa
            </a>
            <a href="censos.html" class="sidebar-link">
                <i class="fas fa-list"></i> Lista de Censos
            </a>
            <hr>
            <button class="btn btn-sm btn-outline-danger w-100" onclick="logout()">
                <i class="fas fa-sign-out-alt me-1"></i>Salir
            </button>
        </nav>
    </div>

    <!-- ── Overlay para cerrar sidebar ─────────────────────────────────────── -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- ── Contenido principal ────────────────────────── -->
    <div class="container mt-4">

        <!-- Formulario de Censo Completo -->
        <div class="section-card" id="registroCenso">
            <p class="section-title">
                <i class="fas fa-clipboard-list"></i> Registrar Censo de Mascota
            </p>
            <form id="mascotaForm">
                
                <!-- Sección: Datos del Dueño -->
                <div class="form-section">
                    <h6 class="form-section-title">
                        <i class="fas fa-user"></i> Datos del Dueño
                    </h6>
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label for="nombres" class="form-label">Nombres <span class="text-danger">*</span></label>
                            <input type="text" id="nombres" class="form-control" placeholder="Ej: Juan Carlos" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="apellidos" class="form-label">Apellidos <span class="text-danger">*</span></label>
                            <input type="text" id="apellidos" class="form-control" placeholder="Ej: Pérez García" required>
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="tipoDocumento" class="form-label">Tipo de Documento <span class="text-danger">*</span></label>
                            <select id="tipoDocumento" class="form-select" required>
                                <option value="" selected disabled>Seleccione...</option>
                                <option value="CC">Cédula de Ciudadanía (CC)</option>
                                <option value="CE">Cédula de Extranjería (CE)</option>
                                <option value="TI">Tarjeta de Identidad (TI)</option>
                                <option value="Pasaporte">Pasaporte</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="documento" class="form-label">Número de Documento <span class="text-danger">*</span></label>
                            <input type="text" id="documento" class="form-control" placeholder="Ej: 1234567890" required>
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="telefono" class="form-label">Teléfono <span class="text-danger">*</span></label>
                            <input type="tel" id="telefono" class="form-control" placeholder="Ej: 3001234567" required>
                        </div>
                        <div class="col-12 col-md-8">
                            <label for="direccion" class="form-label">Dirección <span class="text-danger">*</span></label>
                            <input type="text" id="direccion" class="form-control" placeholder="Ej: Calle 10 # 20-30" required>
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="ciudad" class="form-label">Ciudad <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <select id="ciudad" class="form-select" required>
                                    <option value="">Selecciona una ciudad</option>
                                    <option value="Bogotá">Bogotá</option>
                                    <option value="Medellín">Medellín</option>
                                    <option value="Cali">Cali</option>
                                    <option value="Barranquilla">Barranquilla</option>
                                    <option value="Cartagena">Cartagena</option>
                                    <option value="Santa Marta">Santa Marta</option>
                                    <option value="Cúcuta">Cúcuta</option>
                                    <option value="Bucaramanga">Bucaramanga</option>
                                    <option value="Tunja">Tunja</option>
                                    <option value="Duitama">Duitama</option>
                                    <option value="Sogamoso">Sogamoso</option>
                                    <option value="Ipiales">Ipiales</option>
                                    <option value="Pasto">Pasto</option>
                                    <option value="Popayán">Popayán</option>
                                    <option value="Armenia">Armenia</option>
                                    <option value="Pereira">Pereira</option>
                                    <option value="Manizales">Manizales</option>
                                    <option value="Ibagué">Ibagué</option>
                                    <option value="Villavicencio">Villavicencio</option>
                                    <option value="Yopal">Yopal</option>
                                    <option value="Arauca">Arauca</option>
                                    <option value="Inírida">Inírida</option>
                                    <option value="Puerto Carreño">Puerto Carreño</option>
                                    <option value="Leticia">Leticia</option>
                                    <option value="Mitú">Mitú</option>
                                    <option value="La Chorrera">La Chorrera</option>
                                    <option value="Puerto Asís">Puerto Asís</option>
                                    <option value="Mocoa">Mocoa</option>
                                    <option value="Florencia">Florencia</option>
                                    <option value="Neiva">Neiva</option>
                                    <option value="Valledupar">Valledupar</option>
                                    <option value="Riohacha">Riohacha</option>
                                    <option value="Santa Cruz de Mompox">Santa Cruz de Mompox</option>
                                    <option value="Sincelejo">Sincelejo</option>
                                    <option value="Montería">Montería</option>
                                    <option value="Quibdó">Quibdó</option>
                                    <option value="OTRA">Otra ciudad </option>
                                </select>
                                <input type="text" id="ciudadManual" class="form-control" placeholder="Digita tu ciudad" style="display:none;">
                            </div>
                        </div>
                        </div>
                    </div>
                </div>

                <!-- Sección: Datos de la Mascota -->
                <div class="form-section">
                    <h6 class="form-section-title">
                        <i class="fas fa-paw"></i> Datos de la Mascota
                    </h6>
                    <div class="row g-3">
                        <div class="col-12 col-md-4">
                            <label for="nombre" class="form-label">Nombre <span class="text-danger">*</span></label>
                            <input type="text" id="nombre" class="form-control" placeholder="Ej: Firulais" required>
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="tipo" class="form-label">Tipo <span class="text-danger">*</span></label>
                            <select id="tipo" class="form-select" required>
                                <option value="" selected disabled>Seleccione...</option>
                                <option value="PERRO"> Perro</option>
                                <option value="GATO"> Gato</option>
                                <option value="PAJARO"> Pájaro</option>
                                <option value="CONEJO"> Conejo</option>
                                <option value="HAMSTER"> Hámster</option>
                                <option value="OTRO"> Otro</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="genero" class="form-label">Género <span class="text-danger">*</span></label>
                            <select id="genero" class="form-select" required>
                                <option value="" selected disabled>Seleccione...</option>
                                <option value="MACHO">Macho</option>
                                <option value="HEMBRA">Hembra</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="edad" class="form-label">Edad (años) <span class="text-danger">*</span></label>
                            <input type="number" id="edad" class="form-control" placeholder="Ej: 3" min="0" step="0.1" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="fotografia" class="form-label">URL Fotografía (opcional)</label>
                            <input type="url" id="fotografia" class="form-control" placeholder="https://ejemplo.com/foto.jpg">
                        </div>
                    </div>
                </div>

                <!-- Botones de acción -->
                <div class="mt-3 d-flex gap-2 flex-wrap">
                    <button id="btnGuardar" type="submit" class="btn btn-primary">
                        <i class="fas fa-plus me-1"></i>Registrar Censo
                    </button>
                    <button id="btnCancelarEdicion" type="button" class="btn btn-secondary d-none">
                        <i class="fas fa-xmark me-1"></i>Cancelar
                    </button>
                </div>
            </form>
        </div>

        <!-- Geolocalización -->
        <div class="section-card">
            <p class="section-title">
                <i class="fas fa-map-location-dot"></i> Ubicación
            </p>
            <button id="geoBtn" class="geo-btn mb-3" onclick="getGeoLocation()">
                <i class="fas fa-location-crosshairs"></i> Obtener mi ubicación
            </button>
            <div id="map"></div>
        </div>

        <!-- Cámara -->
        <div class="section-card">
            <p class="section-title">
                <i class="fas fa-camera"></i> Cámara
            </p>
            <div class="d-flex flex-column align-items-start gap-3">
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <select id="cameraSelect" class="form-select" style="width: auto;">
                        <option value="user">Cámara frontal</option>
                        <option value="environment">Cámara trasera</option>
                    </select>
                    <button id="btnCamara" class="btn btn-secondary">
                        <i class="fas fa-video me-1"></i>Abrir cámara
                    </button>
                    <button id="btnFoto" class="btn btn-primary" style="display:none;">
                        <i class="fas fa-circle me-1"></i>Tomar foto
                    </button>
                </div>
                <video id="video" width="320" height="240" autoplay style="display:none;"></video>
                <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
                <img id="foto" alt="Foto tomada" style="display:none; max-width:320px; margin-top:0.5rem;" />
            </div>
        </div>

    </div><!-- /container -->

    <!-- Toast container -->
    <div id="toastContainer"></div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pouchdb@9.0.0/dist/pouchdb.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/geo.js"></script>
    <script src="js/app.js"></script>
    <script src="js/photo.js"></script>
    <script>verificarAuth();</script>

    <!-- Registro del Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        console.log('[SW] Registrado:', reg.scope);
                        window.swReg = reg;

                        // Verificar suscripción existente
                        reg.pushManager.getSubscription().then(subscription => {
                            if (subscription) {
                                console.log('Suscripción existente encontrada:', subscription);
                                if (window.verificarSuscripcion) {
                                    window.verificarSuscripcion(true);
                                }
                            }
                        });
                    })
                    .catch(err => console.error('[SW] Error al registrar:', err));
            });
        }
    </script>

</body>

</html>
