<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Nuevo Censo</title>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="../../index.html">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
            <span class="navbar-text text-white">Nuevo Censo</span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">Registrar Censo de Mascota</h5>
            </div>
            <div class="card-body">
                <form id="censoForm">
                    <!-- Buscar o crear dueño -->
                    <h6 class="border-bottom pb-2">1. Información del Dueño</h6>
                    <div class="mb-3">
                        <label class="form-label">¿El dueño ya está registrado?</label>
                        <div class="btn-group w-100" role="group">
                            <input type="radio" class="btn-check" name="tipoDueno" id="duenoExistente" value="existente">
                            <label class="btn btn-outline-primary" for="duenoExistente">Buscar Existente</label>
                            
                            <input type="radio" class="btn-check" name="tipoDueno" id="duenoNuevo" value="nuevo" checked>
                            <label class="btn btn-outline-primary" for="duenoNuevo">Registrar Nuevo</label>
                        </div>
                    </div>

                    <div id="buscarDuenoSection" class="d-none mb-3">
                        <input type="text" class="form-control" id="buscarDueno" placeholder="Buscar por documento o nombre">
                        <div id="resultadosBusqueda" class="list-group mt-2"></div>
                    </div>

                    <div id="nuevoDuenoSection">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombres *</label>
                                <input type="text" class="form-control" id="duenoNombres" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Apellidos *</label>
                                <input type="text" class="form-control" id="duenoApellidos" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Tipo Doc *</label>
                                <select class="form-select" id="duenoTipoDoc" required>
                                    <option value="CC">CC</option>
                                    <option value="CE">CE</option>
                                    <option value="TI">TI</option>
                                    <option value="PP">PP</option>
                                </select>
                            </div>
                            <div class="col-md-8 mb-3">
                                <label class="form-label">Documento *</label>
                                <input type="text" class="form-control" id="duenoDocumento" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Dirección *</label>
                                <input type="text" class="form-control" id="duenoDireccion" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Teléfono *</label>
                                <input type="tel" class="form-control" id="duenoTelefono" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Ciudad *</label>
                                <input type="text" class="form-control" id="duenoCiudad" required>
                            </div>
                        </div>
                    </div>

                    <!-- Información de la mascota -->
                    <h6 class="border-bottom pb-2 mt-4">2. Información de la Mascota</h6>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombre *</label>
                            <input type="text" class="form-control" id="mascotaNombre" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Género *</label>
                            <select class="form-select" id="mascotaGenero" required>
                                <option value="Macho">Macho</option>
                                <option value="Hembra">Hembra</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Edad</label>
                            <input type="number" class="form-control" id="mascotaEdad" min="0" value="0">
                        </div>
                    </div>

                    <!-- Fotografía de la mascota -->
                    <div class="mb-3">
                        <label class="form-label">Fotografía de la Mascota *</label>
                        <input type="file" class="form-control" id="mascotaFoto" accept="image/*" capture="environment" required>
                        <div class="form-text">Máximo 50 KB</div>
                        <img id="previewMascota" class="mt-2 d-none" style="max-width: 200px;">
                    </div>

                    <!-- Fotografía del censo -->
                    <h6 class="border-bottom pb-2 mt-4">3. Fotografía del Censo</h6>
                    <div class="mb-3">
                        <label class="form-label">Fotografía del Censo *</label>
                        <input type="file" class="form-control" id="censoFoto" accept="image/*" capture="environment" required>
                        <div class="form-text">Máximo 50 KB</div>
                        <img id="previewCenso" class="mt-2 d-none" style="max-width: 200px;">
                    </div>

                    <!-- Ubicación GPS -->
                    <h6 class="border-bottom pb-2 mt-4">4. Ubicación GPS</h6>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Latitud *</label>
                            <input type="number" step="any" class="form-control" id="lat" readonly required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Longitud *</label>
                            <input type="number" step="any" class="form-control" id="lon" readonly required>
                        </div>
                    </div>
                    <button type="button" class="btn btn-info btn-sm" onclick="obtenerUbicacion()">
                        <i class="bi bi-geo-alt"></i> Obtener Ubicación
                    </button>

                    <hr class="my-4">
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg" id="btnGuardar">
                            <i class="bi bi-save"></i> Guardar Censo
                        </button>
                        <a href="index.html" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/nuevo-censo.js"></script>
</body>
</html>
