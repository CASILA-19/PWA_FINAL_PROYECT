<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#198754">
    <link rel="manifest" href="/manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Mascotas</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="/img/logo.jpg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                Mascotas
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <span id="syncStatus" class="badge bg-secondary ms-2">Comprobando...</span>
                <button id="btnSync" class="btn btn-sm btn-outline-primary" onclick="syncManager.sync()">Sincronizar</button>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h1>Información de mascotas</h1>
        <form id="mascotaForm" class="mb-3">
            <input type="text" id="nombre" placeholder="Nombre de la mascota" class="form-control mb-3" required>
            <select id="tipo" class="form-select mb-3" aria-label="Tipo de mascota" required>
                <option value="" selected disabled>Selecciona el tipo de mascota</option>
                <option value="Perro">Perro</option>
                <option value="Gato">Gato</option>
                <option value="Pajaro">Pajaro</option>
            </select>
            <input type="number" id="edad" placeholder="Edad de la mascota" class="form-control mb-3" min="0" required>
            <button id="btnGuardar" type="submit" class="btn btn-primary">Agregar</button>
            <button id="btnCancelarEdicion" type="button" class="btn btn-secondary d-none">Cancelar</button>
        </form>
        <table class="table mt-3">
            <thead>
                <tr>
                    <th scope="col">Nombre</th>
                    <th scope="col">Tipo</th>
                    <th scope="col">Edad</th>
                    <th scope="col">Actualizar</th>
                    <th scope="col">Eliminar</th>
                </tr>
            </thead>
            <tbody>
                <!-- Aquí se agregarán las filas de la tabla dinámicamente -->
            </tbody>
        </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/pouchdb@9.0.0/dist/pouchdb.min.js"></script>
    <script src="app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('SW registrado:', reg.scope))
          .catch(err => console.error('SW error:', err));
      }

      let deferredPrompt;
      
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        console.log('PWA instalable detectada');
      });
    </script>
</body>
</html>
