services:

  postgres:
    container_name: mascotas_database
    image: postgres:16
    restart: always
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - ${MASCOTAS_POSTGRES_PORT}:5432
    environment:
      - POSTGRES_USER=${MASCOTAS_POSTGRES_USER}
      - POSTGRES_PASSWORD=${MASCOTAS_POSTGRES_PASSWORD}
      - POSTGRES_DB=${MASCOTAS_POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MASCOTAS_POSTGRES_USER} -d ${MASCOTAS_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-mascotas:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - ${MASCOTAS_PORT}:${MASCOTAS_PORT}
    environment:
      - MASCOTAS_PORT=${MASCOTAS_PORT}
      - PORT=${MASCOTAS_PORT}
      - MASCOTAS_POSTGRES_HOST=postgres
      - MASCOTAS_POSTGRES_USER=${MASCOTAS_POSTGRES_USER}
      - MASCOTAS_POSTGRES_PASSWORD=${MASCOTAS_POSTGRES_PASSWORD}
      - MASCOTAS_POSTGRES_DB=${MASCOTAS_POSTGRES_DB}
      - MASCOTAS_POSTGRES_PORT=5432
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./backend:/app
      - /app/node_modules
