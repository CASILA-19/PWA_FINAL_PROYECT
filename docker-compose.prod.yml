services:

  postgres:
    container_name: mascotas_database
    image: postgres:16
    restart: always
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - ${MASCOTAS_POSTGRES_PORT}:5432
    environment:
      - POSTGRES_USER=${MASCOTAS_POSTGRES_USER}
      - POSTGRES_PASSWORD=${MASCOTAS_POSTGRES_PASSWORD}
      - POSTGRES_DB=${MASCOTAS_POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MASCOTAS_POSTGRES_USER} -d ${MASCOTAS_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-mascotas:
    image: haccmusik/mascotas:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - ${MASCOTAS_PORT}:${MASCOTAS_PORT}
    environment:
      - MASCOTAS_PORT=${MASCOTAS_PORT}
      - PORT=${MASCOTAS_PORT}
      - MASCOTAS_DATABASE_URL=postgresql://${MASCOTAS_POSTGRES_USER}:${MASCOTAS_POSTGRES_PASSWORD}@postgres:5432/${MASCOTAS_POSTGRES_DB}?schema=public
