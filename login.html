<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mascotas</title>
    <link rel="icon" href="img/icon-192.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0062FF 0%, #759ee1 100%);
        }
        .login-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .login-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            display: block;
            border-radius: 50%;
        }
        .form-switch-btn {
            background: none;
            border: none;
            color: #0062FF;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="img/logo.jpg" alt="Logo" class="login-logo">
        
        <!-- LOGIN FORM -->
        <div id="loginSection">
            <h3 class="text-center mb-4">Iniciar Sesión</h3>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="usuario" class="form-label">Usuario</label>
                    <input type="text" id="usuario" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input type="password" id="contrasena" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-2">
                    <i class="fas fa-sign-in-alt me-2"></i>Ingresar
                </button>
            </form>
            <p class="text-center mt-3">
                ¿No tienes cuenta? <button class="form-switch-btn" onclick="mostrarRegistro()">Regístrate aquí</button>
            </p>
        </div>

        <!-- REGISTRO FORM -->
        <div id="registroSection" style="display:none;">
            <h3 class="text-center mb-4">Registro de Usuario</h3>
            <form id="registroForm">
                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label">Nombres</label>
                        <input type="text" id="regNombres" class="form-control" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Apellidos</label>
                        <input type="text" id="regApellidos" class="form-control" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Tipo Documento</label>
                        <select id="regTipoDocumento" class="form-select" required>
                            <option value="CC">CC</option>
                            <option value="CE">CE</option>
                            <option value="TI">TI</option>
                            <option value="Pasaporte">Pasaporte</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Documento</label>
                        <input type="text" id="regDocumento" class="form-control" placeholder="Ej: 1234567890" required>
                        <small class="text-muted">Solo números</small>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Dirección</label>
                        <input type="text" id="regDireccion" class="form-control" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Teléfono</label>
                        <input type="text" id="regTelefono" class="form-control" placeholder="Ej: 3001234567" required>
                        <small class="text-muted">Solo números</small>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Ciudad</label>
                        <div class="input-group">
                            <select id="regCiudad" class="form-select" required>
                                <option value="">Selecciona una ciudad</option>
                                <option value="Bogotá">Bogotá</option>
                                <option value="Medellín">Medellín</option>
                                <option value="Cali">Cali</option>
                                <option value="Barranquilla">Barranquilla</option>
                                <option value="Cartagena">Cartagena</option>
                                <option value="Santa Marta">Santa Marta</option>
                                <option value="Cúcuta">Cúcuta</option>
                                <option value="Bucaramanga">Bucaramanga</option>
                                <option value="Tunja">Tunja</option>
                                <option value="Duitama">Duitama</option>
                                <option value="Sogamoso">Sogamoso</option>
                                <option value="Ipiales">Ipiales</option>
                                <option value="Pasto">Pasto</option>
                                <option value="Popayán">Popayán</option>
                                <option value="Armenia">Armenia</option>
                                <option value="Pereira">Pereira</option>
                                <option value="Manizales">Manizales</option>
                                <option value="Ibagué">Ibagué</option>
                                <option value="Villavicencio">Villavicencio</option>
                                <option value="Yopal">Yopal</option>
                                <option value="Arauca">Arauca</option>
                                <option value="Inírida">Inírida</option>
                                <option value="Puerto Carreño">Puerto Carreño</option>
                                <option value="Leticia">Leticia</option>
                                <option value="Mitú">Mitú</option>
                                <option value="La Chorrera">La Chorrera</option>
                                <option value="Puerto Asís">Puerto Asís</option>
                                <option value="Mocoa">Mocoa</option>
                                <option value="Florencia">Florencia</option>
                                <option value="Neiva">Neiva</option>
                                <option value="Valledupar">Valledupar</option>
                                <option value="Riohacha">Riohacha</option>
                                <option value="Santa Cruz de Mompox">Santa Cruz de Mompox</option>
                                <option value="Sincelejo">Sincelejo</option>
                                <option value="Montería">Montería</option>
                                <option value="Quibdó">Quibdó</option>
                                <option value="OTRA">Otra ciudad </option>
                            </select>
                            <input type="text" id="regCiudadManual" class="form-control" placeholder="Digita tu ciudad" style="display:none;">
                        </div>
                        <small class="text-muted">Selecciona de la lista o elige "Otra ciudad" para digitar</small>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Usuario</label>
                        <input type="text" id="regUsuario" class="form-control" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Contraseña</label>
                        <input type="password" id="regContrasena" class="form-control" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-3">
                    <i class="fas fa-user-plus me-2"></i>Registrarse
                </button>
            </form>
            <p class="text-center mt-3">
                ¿Ya tienes cuenta? <button class="form-switch-btn" onclick="mostrarLogin()">Inicia sesión aquí</button>
            </p>
        </div>

        <div id="mensaje" class="mt-3"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
