<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Censos</title>
    <link rel="icon" href="img/icon-192.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0062FF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Censos">
    <link rel="apple-touch-icon" href="img/icon-192.svg">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- ── Navbar ─────────────────────────────────────── -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <button class="btn btn-outline-primary me-2" id="btnMenuToggle" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <a class="navbar-brand" href="index.html">
                <img src="img/logo.jpg" alt="Logo Mascotas">
                Mascotas PROPWA_001
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <span id="usuarioActual" class="badge bg-primary"></span>
                <div class="vr"></div>
                <span id="syncStatus" class="badge bg-secondary">Comprobando...</span>
                <button id="btnSync" class="btn btn-sm btn-outline-primary" onclick="syncManager.sync()">
                    <i class="fas fa-rotate me-1"></i>Sincronizar
                </button>
                <div class="vr"></div>
                <span id="notificationStatus" class="badge bg-secondary">Desactivadas</span>
                <button id="btnActivarNotificaciones" class="btn btn-sm btn-success"
                    title="Activar notificaciones push">
                    <i class="fas fa-bell me-1"></i>Activar
                </button>
                <button id="btnDesactivarNotificaciones" class="btn btn-sm btn-danger" style="display:none;"
                    title="Desactivar notificaciones push">
                    <i class="fas fa-bell-slash me-1"></i>Desactivar
                </button>
            </div>
        </div>
    </nav>

    <!-- ── Menú Lateral Desplegable ─────────────────────────────────────── -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h5>Menú</h5>
            <button class="btn-close" onclick="toggleSidebar()"></button>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="sidebar-link">
                <i class="fas fa-clipboard-list"></i> Registrar Censo
            </a>
            <a href="mapa.html" class="sidebar-link">
                <i class="fas fa-map"></i> Ver Mapa
            </a>
            <a href="censos.html" class="sidebar-link active">
                <i class="fas fa-list"></i> Lista de Censos
            </a>
            <hr>
            <button class="btn btn-sm btn-outline-danger w-100" onclick="logout()">
                <i class="fas fa-sign-out-alt me-1"></i>Salir
            </button>
        </nav>
    </div>

    <!-- ── Overlay para cerrar sidebar ─────────────────────────────────────── -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- ── Contenido principal ────────────────────────── -->
    <div class="container mt-4">

        <!-- Tabla de censos -->
        <div class="section-card">
            <p class="section-title">
                <i class="fas fa-list"></i> Lista de Censos Registrados
            </p>

            <!-- Búsqueda y Filtros -->
            <div class="row g-3 mb-4">
                <!-- Campo de búsqueda -->
                <div class="col-12 col-lg-6">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" id="searchInput" class="form-control" 
                               placeholder="Buscar por nombre de dueño o mascota...">
                    </div>
                </div>

                <!-- Filtro por especie -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <select id="filterTipo" class="form-select">
                        <option value="">Todas las especies</option>
                        <option value="PERRO">Perro</option>
                        <option value="GATO">Gato</option>
                        <option value="PAJARO">Pájaro</option>
                        <option value="CONEJO">Conejo</option>
                        <option value="HAMSTER">Hámster</option>
                        <option value="OTRO">Otro</option>
                    </select>
                </div>

                <!-- Filtro por edad -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <select id="filterEdad" class="form-select">
                        <option value="">Todas las edades</option>
                        <option value="0-1">0 - 1 año</option>
                        <option value="1-3">1 - 3 años</option>
                        <option value="3-5">3 - 5 años</option>
                        <option value="5-10">5 - 10 años</option>
                        <option value="10+">10+ años</option>
                    </select>
                </div>
            </div>

            <!-- Tabla -->
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col">Dueño</th>
                            <th scope="col">Mascota</th>
                            <th scope="col">Tipo</th>
                            <th scope="col">Edad</th>
                            <th scope="col">Estado</th>
                            <th scope="col" class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="mascotasTbody">
                    </tbody>
                </table>
            </div>

            <!-- Estado vacío -->
            <div id="emptyState" class="empty-state" style="display:none;">
                <i class="fas fa-inbox"></i>
                <p>No se encontraron censos</p>
                <small>Intenta ajustar los filtros o la búsqueda</small>
            </div>

            <!-- Paginación -->
            <div class="d-flex justify-content-between align-items-center mt-4 flex-wrap gap-3">
                <div class="d-flex align-items-center gap-2">
                    <label for="itemsPerPage" class="form-label mb-0">Mostrar:</label>
                    <select id="itemsPerPage" class="form-select" style="width: auto;">
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="20">20</option>
                    </select>
                    <span class="text-muted">por página</span>
                </div>
                <div id="paginationInfo" class="text-muted">
                    Mostrando 0 de 0
                </div>
            </div>

            <!-- Botones de paginación -->
            <nav aria-label="Paginación" class="mt-3">
                <ul class="pagination justify-content-center mb-0">
                    <li class="page-item">
                        <button class="page-link" id="prevBtn">
                            <i class="fas fa-chevron-left"></i> Anterior
                        </button>
                    </li>
                    <li class="page-item active">
                        <span class="page-link" id="pageInfo">Página 1</span>
                    </li>
                    <li class="page-item">
                        <button class="page-link" id="nextBtn">
                            Siguiente <i class="fas fa-chevron-right"></i>
                        </button>
                    </li>
                </ul>
            </nav>

        </div>

    </div><!-- /container -->

    <!-- Toast container -->
    <div id="toastContainer"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pouchdb@9.0.0/dist/pouchdb.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/censos.js"></script>
    <script>verificarAuth();</script>

    <!-- Registro del Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        console.log('[SW] Registrado:', reg.scope);
                        window.swReg = reg;

                        // Verificar suscripción existente
                        reg.pushManager.getSubscription().then(subscription => {
                            if (subscription) {
                                console.log('Suscripción existente encontrada:', subscription);
                                if (window.verificarSuscripcion) {
                                    window.verificarSuscripcion(true);
                                }
                            }
                        });
                    })
                    .catch(err => console.error('[SW] Error al registrar:', err));
            });
        }
    </script>

</body>

</html>
